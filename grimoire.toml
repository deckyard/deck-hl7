# Grimoire book configuration for the @deckyard/hl7 documentation.

[book]
title = "@deckyard/hl7"
description = "HL7 v2 messages and MLLP"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-hl7/"
repoUrl = "https://github.com/deckyard/deck-hl7"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-hl7/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
